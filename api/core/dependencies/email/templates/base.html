<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{% block title %}{% endblock %}</title>
  </head>
  <body style="margin: 0; padding: 0; font-family: Arial, sans-serif;">

      <!-- Header -->
      <table role="presentation" width="100%" style="background-color: #FDEADC; height: 7.625rem; text-align: center;">
          <tr>
              <td style="text-align: center;">
                  <div style="display: inline-block; height: 80px; width: 100px; overflow: hidden; background-size: cover;">
                        <img src="https://firebasestorage.googleapis.com/v0/b/python-storage-d1e10.appspot.com/o/tifi%2Ftifi-logo-removebg-preview.png?alt=media&token=683b62e9-0133-4311-a3cc-d6a38a9c5b7d" alt="Logo" style="height: 100%; width: 100%;">
                  </div>
              </td>
          </tr>
      </table>

      {% block content %} {% endblock %}

      <!-- Footer -->
      <table role="presentation" width="100%" style="background-color: #F3EFEE; padding: 1rem 2rem; text-align: justify;">
          <tr>
              <td>
                  <p style="color: #5B5B5D; font-size: 0.875rem; font-weight: 400; margin: 1.5rem 0">Thank you for choosing Tifi.tv. Need help? <a href="https://tifi.tv/contact" style="color: #111; font-weight: 600; text-decoration: underline;">Contact our customer support</a></p>
                  <hr style="border: 1px dashed #969696; margin-bottom: 1.5rem;">
                  <p style="color: #5B5B5D; font-size: 0.875rem; font-weight: 400;">You are receiving this email because you signed up at Tifi.tv. Want to change how you receive these emails? <a href="{{unsubscribe_link}}" style="color: #111; font-weight: 600; text-decoration: none;">Update your preferences or unsubscribe from this list.</a></p>
              </td>
          </tr>
      </table>
  </body>
</html>
