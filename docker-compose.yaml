version: '3.8'
services:
  app:
    image: aivid:1.0
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 7001 --reload",
      ]
    ports:
      - 7100:7001
    working_dir: /app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      mode: replicated
      replicas: 2
      rollback_config:
        parallelism: 1
      update_config:
        parallelism: 1
        failure_action: rollback
        order: start-first
    depends_on:
      - db

  db:
    image: postgres:14.12
    restart: always
    env_file:
      - .env.dev
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD?Variable not set}
      - POSTGRES_USER=${DB_USER?Variable not set}
      - POSTGRES_DB=${DB_NAME?Variable not set}
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - db

volumes:
  db:

networks:
  default:
