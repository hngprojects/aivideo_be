services:
  aivideo_app_prod:
    image: aivideo-prod:latest
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 7001 --reload"]
    container_name: aivideo_prod
    networks:
      - hng-network
    restart: unless-stopped
    ports:
      - 7103:7001
    working_dir: /app 
    volumes:
      - .env:/app/.env    
    depends_on:
      - aivideo_prod_db

  aivideo_prod_db:
    image: postgres:14.12
    container_name: aivideo_prod_db
    restart: always
    volumes:
      - aivideo_prod_db:/var/lib/postgresql/data
      - .env:/app/.env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD?Variable not set}
      - POSTGRES_USER=${DB_USER?Variable not set}
      - POSTGRES_DB=${DB_NAME?Variable not set}
    networks:
      - hng-network

volumes:
  aivideo_prod_db:

networks:
  hng-network:
    driver: bridge