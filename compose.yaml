name: aideo-dev
services:
  app:
    image: ${COMPOSE_PROJECT_NAME}:latest
    env_file:
      - .env
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 7001 --reload",
      ]
    networks:
      - hng-network
    restart: unless-stopped
    ports:
      - 7100:7001
    working_dir: /app
    depends_on:
      - db

  db:
    image: postgres:14.12
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD?Variable not set}
      - POSTGRES_USER=${DB_USER?Variable not set}
      - POSTGRES_DB=${DB_NAME?Variable not set}
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - hng-network
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db:

networks:
  hng-network:
    driver: bridge
