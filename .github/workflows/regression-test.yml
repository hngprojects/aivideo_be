name: Run Regression Tests

on:
  schedule:
    - cron: '*/60 * * * *' # Runs every 60 minutes
  workflow_dispatch: 

jobs:
  run-newman-test:
    runs-on: aivid
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" 

      - name: Install Newman
        run: |
          npm install -g newman

      - name: Run Newman Tests
        run: |
          newman run qa_tests/regression/Core_Product.postman_collection.json -r json --reporter-json-export=result.json --suppress-exit-code

      - name: Copy env file
        run: cp .env.sample .env

      - name: Install pydantic-settings
        run: pip install pydantic-settings requests python-decouple

      - name: Update api-status endpoint
        run: |
          python3 update_api_status.py

