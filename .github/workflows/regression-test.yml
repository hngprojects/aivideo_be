name: Run Regression Tests

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: 


jobs:
  run-newman-test:
    runs-on: pytest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache dependency
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-update-status-${{ hashFiles('**/update_api_status.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-update-status-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" 

      - name: Install Newman
        run: |
          npm install -g newman

      - name: Run Newman Tests
        run: |
          newman run qa_tests/regression/Core_Product.postman_collection.json -r json --reporter-json-export=result.json --suppress-exit-code

      - name: Install pydantic-settings
        run: pip install pydantic-settings

      - name: Update api-status endpoint
        run: |
          python3 update_api_status.py

