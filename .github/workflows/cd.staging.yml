name: Staging Branch Deployment

on:
  push:
    branches: [staging]
    paths-ignore:
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: pydeploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use SSH Action
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd aivideo_be
            git add .
            git stash
            git checkout staging
            git pull origin staging
            source venv-staging/bin/activate
            pip install -r requirements.txt
            alembic upgrade head
            echo "${{ secrets.PASSWORD }}" | sudo -S systemctl restart aivideo-python-staging.service
