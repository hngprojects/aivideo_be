name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "README.md"
      - ".github/workflows/**"

jobs:
  build-and-test:
    runs-on: hng-runner
    timeout-minutes: 10
    env:
      ENV: ${{ secrets.STAGING_ENV_BASE64 }}

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "password"
          POSTGRES_DB: "test"
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Decode and create .env file
        run: |
          echo $ENV | base64 -d > .env

      - name: Update .env with dynamic port
        run: |
          sed -i "s/DB_PORT=.*/DB_PORT=${{ job.services.postgres.ports[5432] }}/" .env
          sed -i "s|DB_URL=.*|DB_URL=postgresql://postgres:password@localhost:${{ job.services.postgres.ports[5432] }}/test|" .env

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p ${{ job.services.postgres.ports[5432] }}; do
            sleep 1
          done
        timeout-minutes: 1

      - name: Run migrations
        run: |
          alembic revision --autogenerate
          alembic upgrade head

      - name: Run app
        run: |
          uvicorn main:app --host 0.0.0.0 --port 5001 &
          pid=$!
          sleep 10
          if ps -p $pid > /dev/null; then
            echo "main.py started successfully"
            kill $pid
          else
            echo "main.py failed to start"
            exit 1
          fi

      - name: Run tests
        run: |
          PYTHONPATH=. pytest
